name: Refresh DOF Lab site data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh publications from Google Sites
        run: python scripts/sync_publications.py
      - name: Refresh public GitHub data
        run: python scripts/sync_github_data.py
      - name: Commit refreshed site data
        run: |
          git add publications.json data.json github-data.json
          if git diff --cached --quiet; then
            echo 'No site data changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh DOF Lab site data'
          git push
