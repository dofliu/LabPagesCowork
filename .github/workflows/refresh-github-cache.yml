name: Refresh GitHub profile cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public GitHub data
        run: python scripts/sync_github_data.py
      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- github-data.json; then
            echo 'No GitHub changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-data.json
          git commit -m 'chore: refresh GitHub profile cache'
          git push
