<!doctype html>
<!-- doflab.cc 專案動畫 · 場景模板（品牌版：暖墨底 + 燒赭/暖金/深林綠）
     規則：1920×1080 固定；動畫從頁面載入 t=0 起算；禁止外連資源（file:// 離線渲染）。
     本地圖片放同層 assets/，用相對路徑 <img src="assets/shot_01.png">。
     每景只改 <title>、.stage 的 --dur、以及 <div class="stage"> 內的內容。 -->
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Check</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b1517}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#f6efe3;position:relative}
/* 品牌色 */
:root{--paper:#faf6ef;--rust:#3fb3a0;--rust-deep:#2a8f80;--gold:#d9ad5b;--forest:#5f9e86;--ink:#0b1517}
/* ── 背景：暖墨底 + 燒赭/暖金光暈 + 紙紋格線 + 暗角 ── */
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 22% 18%,rgba(64,178,160,.17),transparent 62%),
 radial-gradient(1100px 760px at 80% 84%,rgba(217,173,91,.14),transparent 60%),
 linear-gradient(160deg,#13242a 0%,#0b1517 58%,#060c0e 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.45;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(64,178,160,.30),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(120,140,220,.26),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.045;background-image:linear-gradient(rgba(246,239,227,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(246,239,227,.5) 1px,transparent 1px);background-size:64px 64px}
/* 左下品牌浮水印（每景都在，維持系列感） */
.mark{position:absolute;left:64px;bottom:48px;z-index:4;font-size:26px;font-weight:700;letter-spacing:.08em;color:rgba(246,239,227,.55)}
.mark b{color:var(--rust)}
/* ── 鏡頭慢推（--dur 設成本景秒數） ── */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:7s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.05)}}
/* ── 字體系統 ── */
.kicker{font-size:30px;font-weight:700;letter-spacing:.5em;text-indent:.5em;color:var(--gold);text-transform:uppercase}
.h1{font-size:112px;font-weight:900;line-height:1.14;text-align:center;letter-spacing:.01em;
 background:linear-gradient(100deg,#f2fffb 16%,#a6e8d8 52%,#e6c27a 88%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 8px 40px rgba(64,178,160,.22))}
.sub{font-size:40px;font-weight:400;color:rgba(246,239,227,.8);text-align:center;line-height:1.6}
.accent{color:var(--gold);font-weight:700}
/* ── 元件 ── */
.chip{display:inline-flex;align-items:center;gap:16px;padding:20px 38px;border-radius:999px;font-size:36px;font-weight:700;white-space:nowrap;
 background:rgba(18,36,40,.85);border:1.5px solid rgba(217,173,91,.28);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card{background:linear-gradient(165deg,rgba(22,42,46,.94),rgba(11,22,25,.95));border:1.5px solid rgba(217,173,91,.22);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.badge{display:inline-block;padding:12px 26px;border-radius:12px;font-size:28px;font-weight:700;white-space:nowrap;
 background:rgba(64,178,160,.15);border:1.5px solid rgba(64,178,160,.5);color:#8fe0cf}
.badge.g{background:rgba(120,140,220,.15);border-color:rgba(120,140,220,.5);color:#9fd6c1}
/* ── 真實素材版位 ── */
.shot{width:1400px;max-height:760px;border-radius:22px;overflow:hidden;background:#08100f;
 border:1.5px solid rgba(217,173,91,.25);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.shot img{display:block;width:100%;height:auto}
.frame{width:480px;height:480px;border-radius:26px;overflow:hidden;background:#08100f;border:1.5px solid rgba(217,173,91,.22);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.logo{height:130px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.hero-img{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);opacity:.36;filter:saturate(.8) contrast(.95)}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;--scrim:.78;
 background:radial-gradient(1400px 900px at 50% 46%,rgba(13,10,7,calc(var(--scrim)*.55)),transparent 70%),
 linear-gradient(180deg,rgba(21,17,13,calc(var(--scrim)*.9)),rgba(13,10,7,var(--scrim)))}
/* ── 進場動畫工具類（--d 控延遲；注意：結尾 transform 會蓋掉 translate 置中） ── */
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(64,178,160,.25))}50%{filter:drop-shadow(0 0 42px rgba(64,178,160,.55))}}
.in.glow{animation:rise 1s cubic-bezier(.16,1,.3,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
.pop.glow{animation:pop .8s cubic-bezier(.2,1.4,.35,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
/* ▼▼ 本景專屬 CSS ▼▼ */
.wrap{display:flex;gap:80px;align-items:center;margin-top:50px}
.phone{width:560px;padding:34px 30px;border-radius:48px;border:3px solid rgba(143,224,207,.35)}
.phone .hd{font-size:28px;font-weight:800;color:#8fe0cf;margin-bottom:18px;white-space:nowrap}
.rw{display:flex;align-items:center;gap:16px;padding:16px 18px;margin:10px 0;border-radius:16px;background:rgba(255,255,255,.04);opacity:0;animation:rise .6s ease-out both;animation-delay:var(--d)}
.rw .k{font-size:27px;width:170px;color:rgba(246,239,227,.7);white-space:nowrap}
.rw .v{flex:1;font-size:27px;font-weight:700;white-space:nowrap}
.rw .m{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.m.o{background:rgba(63,179,160,.25);color:#8fe0cf}.m.x{background:rgba(224,103,90,.28);color:#ff9a8c}
.verdict{margin-top:18px;padding:18px;border-radius:16px;text-align:center;font-size:32px;font-weight:900;color:#ffb3a8;background:rgba(224,103,90,.16);border:2px solid rgba(224,103,90,.55);white-space:nowrap}
.rules{width:640px;display:flex;flex-direction:column;gap:22px}
.rule{padding:24px 30px;font-size:32px;line-height:1.45}
.rule b{color:var(--gold)}
/* ▲▲ 本景專屬 CSS ▲▲ */
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<div class="stage" style="z-index:2;--dur:6.5s">
<!-- ▼▼ 本景內容 ▼▼ -->
<div class="kicker in" style="--d:.1s">IDENTITY CHECK</div>
 <div class="h1 in" style="--d:.3s;font-size:86px;margin-top:12px">逐項比對，衝突就拒絕</div>
 <div class="wrap"><div class="phone card in" style="--d:.5s"><div class="hd">📋 示範藥袋 · 核對中</div><div class="rw" style="--d:1.00s"><span class="k">許可國別</span><span class="v">一致</span><span class="m o">✓</span></div><div class="rw" style="--d:1.35s"><span class="k">主管機關</span><span class="v">一致</span><span class="m o">✓</span></div><div class="rw" style="--d:1.70s"><span class="k">許可證號</span><span class="v">一致</span><span class="m o">✓</span></div><div class="rw" style="--d:2.05s"><span class="k">劑型／途徑</span><span class="v">一致</span><span class="m o">✓</span></div><div class="rw" style="--d:2.40s"><span class="k">強度</span><span class="v">0.5 mg ≠ 5 mg</span><span class="m x">✕</span></div>
 <div class="verdict pop" style="--d:3.0s">⛔ 強度衝突 → 不予核實</div></div>
 <div class="rules"><div class="rule card in" style="--d:0.6s"><b>許可證與機關</b>決定產品身分，製造國不能代替</div><div class="rule card in" style="--d:1.0s">強度、劑型、途徑<b>任一衝突</b>直接拒絕</div><div class="rule card in" style="--d:1.4s">複方<b>少一項成分</b>就視為證據不足</div></div></div>
<!-- ▲▲ 本景內容 ▲▲ -->
</div>
<div class="mark">DOF Lab<b>.</b> · doflab.cc</div>
<div class="vig" style="z-index:3"></div>
</body></html>
