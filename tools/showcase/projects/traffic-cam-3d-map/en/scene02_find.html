<!doctype html>
<!-- doflab.cc 專案動畫 · 場景模板（品牌版：暖墨底 + 燒赭/暖金/深林綠）
     規則：1920×1080 固定；動畫從頁面載入 t=0 起算；禁止外連資源（file:// 離線渲染）。
     本地圖片放同層 assets/，用相對路徑 <img src="assets/shot_01.png">。
     每景只改 <title>、.stage 的 --dur、以及 <div class="stage"> 內的內容。 -->
<html lang="en"><head><meta charset="utf-8"><title>SceneXX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#15110d}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#f6efe3;position:relative}
/* 品牌色 */
:root{--paper:#faf6ef;--rust:#d2602f;--rust-deep:#b4451f;--gold:#d9ad5b;--forest:#5f9e86;--ink:#15110d}
/* ── 背景：暖墨底 + 燒赭/暖金光暈 + 紙紋格線 + 暗角 ── */
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 22% 18%,rgba(210,96,47,.17),transparent 62%),
 radial-gradient(1100px 760px at 80% 84%,rgba(217,173,91,.14),transparent 60%),
 linear-gradient(160deg,#241c15 0%,#15110d 58%,#0d0a07 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.45;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(210,96,47,.30),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(95,158,134,.26),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.045;background-image:linear-gradient(rgba(246,239,227,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(246,239,227,.5) 1px,transparent 1px);background-size:64px 64px}
/* 左下品牌浮水印（每景都在，維持系列感） */
.mark{position:absolute;left:64px;bottom:48px;z-index:4;font-size:26px;font-weight:700;letter-spacing:.08em;color:rgba(246,239,227,.55)}
.mark b{color:var(--rust)}
/* ── 鏡頭慢推（--dur 設成本景秒數） ── */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:7s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.05)}}
/* ── 字體系統 ── */
.kicker{font-size:30px;font-weight:700;letter-spacing:.5em;text-indent:.5em;color:var(--gold);text-transform:uppercase}
.h1{font-size:112px;font-weight:900;line-height:1.14;text-align:center;letter-spacing:.01em;
 background:linear-gradient(100deg,#fff8ec 18%,#f0c98a 52%,#e58a5c 84%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 8px 40px rgba(210,96,47,.22))}
.sub{font-size:40px;font-weight:400;color:rgba(246,239,227,.8);text-align:center;line-height:1.6}
.accent{color:var(--gold);font-weight:700}
/* ── 元件 ── */
.chip{display:inline-flex;align-items:center;gap:16px;padding:20px 38px;border-radius:999px;font-size:36px;font-weight:700;white-space:nowrap;
 background:rgba(40,31,23,.85);border:1.5px solid rgba(217,173,91,.28);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card{background:linear-gradient(165deg,rgba(44,34,25,.94),rgba(24,19,14,.95));border:1.5px solid rgba(217,173,91,.22);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.badge{display:inline-block;padding:12px 26px;border-radius:12px;font-size:28px;font-weight:700;white-space:nowrap;
 background:rgba(210,96,47,.15);border:1.5px solid rgba(210,96,47,.5);color:#f3a57e}
.badge.g{background:rgba(95,158,134,.15);border-color:rgba(95,158,134,.5);color:#9fd6c1}
/* ── 真實素材版位 ── */
.shot{width:1400px;max-height:760px;border-radius:22px;overflow:hidden;background:#100c09;
 border:1.5px solid rgba(217,173,91,.25);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.shot img{display:block;width:100%;height:auto}
.frame{width:480px;height:480px;border-radius:26px;overflow:hidden;background:#100c09;border:1.5px solid rgba(217,173,91,.22);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.logo{height:130px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.hero-img{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);opacity:.36;filter:saturate(.8) contrast(.95)}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;--scrim:.78;
 background:radial-gradient(1400px 900px at 50% 46%,rgba(13,10,7,calc(var(--scrim)*.55)),transparent 70%),
 linear-gradient(180deg,rgba(21,17,13,calc(var(--scrim)*.9)),rgba(13,10,7,var(--scrim)))}
/* ── 進場動畫工具類（--d 控延遲；注意：結尾 transform 會蓋掉 translate 置中） ── */
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(210,96,47,.25))}50%{filter:drop-shadow(0 0 42px rgba(210,96,47,.55))}}
.in.glow{animation:rise 1s cubic-bezier(.16,1,.3,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
.pop.glow{animation:pop .8s cubic-bezier(.2,1.4,.35,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
/* ▼▼ 本景專屬 CSS ▼▼ */
/* 夜間地圖配色（覆蓋品牌暖色） */
:root{--cy:#5fe3ff;--gr:#3ddc84;--ye:#ffd43b;--or:#ff922b;--rd:#ff4d5e;--gold:#5fe3ff}
html,body{background:#060b14}
.bg{background:
 radial-gradient(1200px 800px at 20% 16%,rgba(64,170,255,.16),transparent 62%),
 radial-gradient(1100px 760px at 82% 86%,rgba(61,220,132,.10),transparent 60%),
 linear-gradient(160deg,#0d1828 0%,#070d18 58%,#04070d 100%)}
.aur.a{background:radial-gradient(circle,rgba(64,170,255,.28),transparent 62%)}
.aur.b{background:radial-gradient(circle,rgba(150,90,255,.20),transparent 62%)}
.grid{opacity:.06;background-image:linear-gradient(rgba(140,200,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(140,200,255,.5) 1px,transparent 1px)}
.mark b{color:var(--cy)}
.kicker{color:var(--cy)}
.h1{background:linear-gradient(100deg,#f4fbff 15%,#9fe9ff 50%,#5fe39a 88%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 8px 40px rgba(64,170,255,.28))}
.accent{color:var(--cy)}
.chip{background:rgba(14,26,44,.88);border-color:rgba(95,227,255,.32)}
.card{background:linear-gradient(165deg,rgba(18,32,54,.95),rgba(8,15,27,.96));border-color:rgba(95,227,255,.22)}
.badge{background:rgba(95,227,255,.12);border-color:rgba(95,227,255,.5);color:#9fefff}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(95,227,255,.25))}50%{filter:drop-shadow(0 0 42px rgba(95,227,255,.6))}}
.t{position:absolute;top:96px;left:0;right:0;text-align:center;font-size:66px;font-weight:900;letter-spacing:.02em;color:#eef8ff}
.t small{display:block;font-size:30px;font-weight:500;color:rgba(220,236,255,.62);margin-top:14px;letter-spacing:.04em}
/* 六角光柱 */
.pil{position:absolute;width:30px;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,1,.3,1) both;animation-delay:var(--d,0s)}
.pil i{display:block;width:100%;height:100%;clip-path:polygon(25% 0,75% 0,100% 8%,100% 100%,0 100%,0 8%);
 background:linear-gradient(0deg,var(--c,#5fe3ff) 0%,rgba(255,255,255,.0) 100%);opacity:.85}
.pil::after{content:"";position:absolute;left:-22px;right:-22px;bottom:-12px;height:24px;border-radius:50%;
 background:radial-gradient(closest-side,var(--c,#5fe3ff),transparent);opacity:.7}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.draw{stroke-dasharray:var(--l,2000);stroke-dashoffset:var(--l,2000);animation:draw 2.2s ease-out both;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}

.wrap{position:absolute;left:110px;right:110px;top:285px;display:flex;gap:56px;align-items:flex-start}
.mapc{width:900px;height:640px;position:relative;overflow:hidden}
.mapc svg{position:absolute;inset:0}
.search{position:absolute;left:36px;right:36px;top:30px;height:78px;border-radius:18px;background:rgba(5,12,22,.92);
 border:1.5px solid rgba(95,227,255,.4);display:flex;align-items:center;padding:0 26px;font-size:32px;color:#dff6ff;z-index:3}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;width:0;animation:type 1.4s steps(9) .6s both;border-right:3px solid #5fe3ff}
@keyframes type{to{width:var(--w)}}
.pin{position:absolute;left:432px;top:300px;font-size:64px;z-index:4;animation:drop .7s cubic-bezier(.3,1.6,.5,1) 2.1s both}
@keyframes drop{from{opacity:0;transform:translateY(-160px)}to{opacity:1;transform:none}}
.ring{position:absolute;left:520px;top:404px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #ffd43b;
 opacity:0;animation:ring 1.4s ease-out 3s 2 both;z-index:3}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3.2)}}
.panel{width:760px;padding:30px 34px}
.ph{display:flex;align-items:center;justify-content:space-between;font-size:32px;font-weight:800;color:#eaf7ff}
.live{font-size:22px;font-weight:800;padding:8px 16px;border-radius:10px;background:rgba(255,77,94,.18);border:1.5px solid rgba(255,77,94,.6);color:#ff9aa4;white-space:nowrap}
.frm{margin-top:22px;height:330px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(180deg,#1b2a3f 0%,#0d1622 46%,#151b22 46%,#0b0f14 100%)}
.car{position:absolute;width:34px;height:20px;border-radius:5px;animation:drive 3.2s linear infinite}
@keyframes drive{from{transform:translate(0,0) scale(.35)}to{transform:translate(var(--dx),190px) scale(1.4)}}
.btns{display:flex;gap:14px;margin-top:22px}
.btns span{font-size:24px;padding:10px 18px;border-radius:12px;background:rgba(95,227,255,.08);border:1.5px solid rgba(95,227,255,.3);color:#cfefff;white-space:nowrap}
.spd{display:flex;gap:18px;margin-top:20px}
.spd div{flex:1;border-radius:14px;padding:14px 18px;font-size:24px;color:rgba(230,244,255,.8);background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08)}
.spd b{font-size:40px;margin-left:10px}
.note{position:absolute;right:120px;bottom:52px;font-size:22px;color:rgba(220,236,255,.45)}


/* ▲▲ 本景專屬 CSS ▲▲ */
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<div class="stage" style="z-index:2;--dur:6.5s">
<!-- ▼▼ 本景內容 ▼▼ -->

 <div class="t in" style="--d:.1s">One tap, the nearest camera<small>Tap the map, tap a pillar, search &ldquo;Nat. Hwy 1 S 170K&rdquo;, or use your location</small></div>
 <div class="wrap">
  <div class="card mapc in" style="--d:.3s">
   <svg width="900" height="640" viewBox="0 0 900 640"><g fill="none" stroke-linecap="round">
    <path d="M-20 520 C 200 470 330 470 520 404 S 760 260 920 240" stroke="#3ea8ff" stroke-width="9" opacity=".8"/>

    <path d="M462 368 L 520 404" stroke="#ffd43b" stroke-width="4" stroke-dasharray="10 10" class="draw" style="--l:80;--d:2.8s"/>
   </g></svg>
   <div class="pil" style="left:205px;top:390px;height:110px;--c:#5fe3ff;--d:0.8s"><i></i></div><div class="pil" style="left:680px;top:200px;height:120px;--c:#3ddc84;--d:0.9s"><i></i></div><div class="pil" style="left:285px;top:240px;height:90px;--c:#7a8cff;--d:1.0s"><i></i></div><div class="pil" style="left:760px;top:480px;height:80px;--c:#5fe3ff;--d:1.1s"><i></i></div><div class="pil" style="left:505px;top:234px;height:170px;--c:#ffd43b;--d:3.0s"><i></i></div>
   <div class="search"><span style="margin-right:16px">🔍</span><span class="typed" style="--w:6.6em">N1 S 170K</span></div>

  </div>
  <div class="card panel in" style="--d:3.3s">
   <div class="ph"><span>📷 Nat. Hwy 1 · S · 170K</span><span class="live">● LIVE · every 4 s</span></div>

    <svg width="692" height="330" viewBox="0 0 692 330" style="position:absolute;inset:0"><g stroke="rgba(255,255,255,.55)" stroke-width="4" fill="none">
     <path d="M330 152 L 40 330"/><path d="M362 152 L 652 330"/><path d="M346 152 L 346 330" stroke-dasharray="18 22"/></g></svg>
    <div class="car" style="left:330px;top:150px;background:#ffd43b;--dx:-200px;animation-delay:0s"></div>

   </div>
   <div class="btns"><span>⏸ Pause</span><span>🔍 Zoom</span><span>🔗 Source</span><span>☆ Save</span></div>

 </div>
 <div class="note">Illustrative frame and values</div>
<!-- ▲▲ 本景內容 ▲▲ -->

<div class="mark">DOF Lab<b>.</b> · doflab.cc</div>

</body></html>
