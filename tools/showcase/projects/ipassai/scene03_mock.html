<!doctype html>
<!-- doflab.cc 專案動畫 · 場景模板（品牌版：暖墨底 + 燒赭/暖金/深林綠）
     規則：1920×1080 固定；動畫從頁面載入 t=0 起算；禁止外連資源（file:// 離線渲染）。
     本地圖片放同層 assets/，用相對路徑 <img src="assets/shot_01.png">。
     每景只改 <title>、.stage 的 --dur、以及 <div class="stage"> 內的內容。 -->
<html lang="zh-Hant"><head><meta charset="utf-8"><title>全真模考</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#15110d}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#f6efe3;position:relative}
/* 品牌色 */
:root{--paper:#faf6ef;--rust:#d2602f;--rust-deep:#b4451f;--gold:#d9ad5b;--forest:#5f9e86;--ink:#15110d}
/* ── 背景：暖墨底 + 燒赭/暖金光暈 + 紙紋格線 + 暗角 ── */
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 22% 18%,rgba(210,96,47,.17),transparent 62%),
 radial-gradient(1100px 760px at 80% 84%,rgba(217,173,91,.14),transparent 60%),
 linear-gradient(160deg,#241c15 0%,#15110d 58%,#0d0a07 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.45;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(210,96,47,.30),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(95,158,134,.26),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.045;background-image:linear-gradient(rgba(246,239,227,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(246,239,227,.5) 1px,transparent 1px);background-size:64px 64px}
/* 左下品牌浮水印（每景都在，維持系列感） */
.mark{position:absolute;left:64px;bottom:48px;z-index:4;font-size:26px;font-weight:700;letter-spacing:.08em;color:rgba(246,239,227,.55)}
.mark b{color:var(--rust)}
/* ── 鏡頭慢推（--dur 設成本景秒數） ── */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:6.5s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.05)}}
/* ── 字體系統 ── */
.kicker{font-size:30px;font-weight:700;letter-spacing:.5em;text-indent:.5em;color:var(--gold);text-transform:uppercase}
.h1{font-size:112px;font-weight:900;line-height:1.14;text-align:center;letter-spacing:.01em;
 background:linear-gradient(100deg,#fff8ec 18%,#f0c98a 52%,#e58a5c 84%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 8px 40px rgba(210,96,47,.22))}
.sub{font-size:40px;font-weight:400;color:rgba(246,239,227,.8);text-align:center;line-height:1.6}
.accent{color:var(--gold);font-weight:700}
/* ── 元件 ── */
.chip{display:inline-flex;align-items:center;gap:16px;padding:20px 38px;border-radius:999px;font-size:36px;font-weight:700;white-space:nowrap;
 background:rgba(40,31,23,.85);border:1.5px solid rgba(217,173,91,.28);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card{background:linear-gradient(165deg,rgba(44,34,25,.94),rgba(24,19,14,.95));border:1.5px solid rgba(217,173,91,.22);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.badge{display:inline-block;padding:12px 26px;border-radius:12px;font-size:28px;font-weight:700;white-space:nowrap;
 background:rgba(210,96,47,.15);border:1.5px solid rgba(210,96,47,.5);color:#f3a57e}
.badge.g{background:rgba(95,158,134,.15);border-color:rgba(95,158,134,.5);color:#9fd6c1}
/* ── 真實素材版位 ── */
.shot{width:1400px;max-height:760px;border-radius:22px;overflow:hidden;background:#100c09;
 border:1.5px solid rgba(217,173,91,.25);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.shot img{display:block;width:100%;height:auto}
.frame{width:480px;height:480px;border-radius:26px;overflow:hidden;background:#100c09;border:1.5px solid rgba(217,173,91,.22);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.logo{height:130px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.hero-img{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);opacity:.36;filter:saturate(.8) contrast(.95)}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;--scrim:.78;
 background:radial-gradient(1400px 900px at 50% 46%,rgba(13,10,7,calc(var(--scrim)*.55)),transparent 70%),
 linear-gradient(180deg,rgba(21,17,13,calc(var(--scrim)*.9)),rgba(13,10,7,var(--scrim)))}
/* ── 進場動畫工具類（--d 控延遲；注意：結尾 transform 會蓋掉 translate 置中） ── */
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(210,96,47,.25))}50%{filter:drop-shadow(0 0 42px rgba(210,96,47,.55))}}
.in.glow{animation:rise 1s cubic-bezier(.16,1,.3,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
.pop.glow{animation:pop .8s cubic-bezier(.2,1.4,.35,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
/* ▼▼ 本景專屬 CSS ▼▼ */

:root{--ind:#1f2a6b;--ind2:#3a4aa8;--hl:#f2d834;--ok:#2f8a7e;--ng:#b5523b;--pp:#fffdf7}
html,body{background:#f4efe3}
body{color:#1f2a6b}
.bg{background:radial-gradient(1200px 800px at 16% 12%,rgba(58,74,168,.10),transparent 62%),
 radial-gradient(1000px 700px at 86% 90%,rgba(242,216,52,.20),transparent 60%),
 linear-gradient(160deg,#faf6ec 0%,#f2ecdd 60%,#ebe3d0 100%)}
.aur{opacity:.30;mix-blend-mode:multiply}
.aur.a{background:radial-gradient(circle,rgba(58,74,168,.22),transparent 62%)}
.aur.b{background:radial-gradient(circle,rgba(242,216,52,.40),transparent 62%)}
.grid{opacity:.075;background-image:linear-gradient(rgba(31,42,107,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(31,42,107,.55) 1px,transparent 1px);background-size:64px 64px}
.vig{background:radial-gradient(1600px 1000px at 50% 46%,transparent 62%,rgba(70,58,20,.16) 100%)}
.mark{color:rgba(31,42,107,.55)}.mark b{color:#c9a400}
.kicker{color:var(--ind2)}
.h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ind);filter:none}
.sub{color:rgba(31,42,107,.78)}
.card{background:var(--pp);border:2px solid rgba(31,42,107,.16);border-radius:10px;box-shadow:0 18px 50px rgba(31,42,107,.13)}
.chip{background:var(--pp);border:2px solid rgba(31,42,107,.24);box-shadow:0 10px 30px rgba(31,42,107,.10);color:var(--ind)}
.hlt{background-image:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;
 animation:hl .9s cubic-bezier(.3,.9,.4,1) both;animation-delay:var(--h,1s)}
@keyframes hl{to{background-size:100% 100%}}
.sec{font-size:30px;font-weight:800;letter-spacing:.3em;text-indent:.3em;color:var(--ind2);white-space:nowrap}
.sec i{font-style:normal;background:var(--hl);color:var(--ind);padding:2px 14px;margin-right:16px;letter-spacing:.05em}
.tab{display:inline-block;padding:14px 30px;border-radius:5px;font-size:30px;font-weight:700;white-space:nowrap;background:var(--ind);color:#fffdf7;box-shadow:0 8px 22px rgba(31,42,107,.2)}
.tab.y{background:var(--hl);color:var(--ind)}
.tab.o{background:var(--pp);color:var(--ind);border:2px solid var(--ind)}

.pipe{position:relative;width:1640px;height:190px;margin-top:56px}
.track{position:absolute;left:110px;right:110px;top:46px;height:8px;background:rgba(31,42,107,.14);border-radius:4px}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ind);border-radius:4px;animation:tr 2.6s linear .9s both}
@keyframes tr{to{width:100%}}
.nodes{position:absolute;inset:0;display:flex;justify-content:space-between}
.nd{width:220px;display:flex;flex-direction:column;align-items:center;gap:20px}
.nd b{width:100px;height:100px;border-radius:8px;background:var(--pp);border:3px solid rgba(31,42,107,.25);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:rgba(31,42,107,.45);
 animation:lit .45s ease-out both;animation-delay:var(--l)}
@keyframes lit{to{background:var(--hl);border-color:var(--ind);color:var(--ind);box-shadow:0 10px 30px rgba(31,42,107,.2)}}
.nd span{font-size:30px;font-weight:700;text-align:center;line-height:1.3;color:var(--ind)}
.cons{display:flex;gap:44px;margin-top:40px;align-items:center}
.sheet{width:720px;padding:30px 38px}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:800;color:var(--ind)}
.tm{font-family:"DejaVu Sans Mono",monospace;font-size:40px;font-weight:700;color:var(--ind);background:rgba(31,42,107,.07);padding:4px 16px;border-radius:6px}
.tm small{font-family:"Noto Sans CJK TC",sans-serif;font-size:22px;font-weight:600;margin-right:12px;color:rgba(31,42,107,.65)}
.cells{display:grid;grid-template-columns:repeat(15,1fr);gap:8px;margin-top:22px}
.cells i{height:30px;border-radius:4px;background:rgba(31,42,107,.09);animation:cf .3s ease-out both;animation-delay:var(--c)}
@keyframes cf{to{background:var(--ind2)}}
.cells i.f{animation-name:ff}
@keyframes ff{to{background:var(--hl);box-shadow:inset 0 0 0 3px var(--ng)}}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tools .chip{font-size:30px;padding:16px 28px;justify-content:flex-start}


/* ▲▲ 本景專屬 CSS ▲▲ */
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<div class="stage" style="z-index:2">
<!-- ▼▼ 本景內容 ▼▼ -->
 <div class="sec in" style="--d:.1s"><i>02</i>全真模考</div>
 <div class="h1 in" style="--d:.3s;font-size:92px;margin-top:16px">照官方規格，全真模考</div>
 <div class="pipe in" style="--d:.6s"><div class="track"><i></i></div><div class="nodes"><div class="nd"><b style="--l:0.90s">1</b><span>選擇考科</span></div><div class="nd"><b style="--l:1.52s">2</b><span>依題量時限組卷</span></div><div class="nd"><b style="--l:2.14s">3</b><span>倒數作答</span></div><div class="nd"><b style="--l:2.76s">4</b><span>交卷判定</span></div><div class="nd"><b style="--l:3.38s">5</b><span>分項診斷</span></div></div></div>
 <div class="cons">
  <div class="card sheet in" style="--d:1.8s"><div class="sh-h"><span>答題卡</span><span class="tm"><small>剩餘時間</small><span id="tm">60:00</span></span></div><div class="cells"><i style="--c:2.00s"></i><i style="--c:2.05s"></i><i style="--c:2.10s"></i><i style="--c:2.15s"></i><i style="--c:2.20s"></i><i style="--c:2.25s"></i><i style="--c:2.30s"></i><i style="--c:2.35s"></i><i style="--c:2.40s"></i><i style="--c:2.45s"></i><i style="--c:2.50s"></i><i style="--c:2.55s"></i><i style="--c:2.60s"></i><i style="--c:2.65s"></i><i style="--c:2.70s"></i><i style="--c:2.75s"></i><i style="--c:2.80s"></i><i class="f" style="--c:2.85s"></i><i style="--c:2.90s"></i><i style="--c:2.95s"></i><i style="--c:3.00s"></i><i style="--c:3.05s"></i><i style="--c:3.10s"></i><i style="--c:3.15s"></i><i style="--c:3.20s"></i><i style="--c:3.25s"></i><i style="--c:3.30s"></i><i style="--c:3.35s"></i><i style="--c:3.40s"></i><i style="--c:3.45s"></i><i style="--c:3.50s"></i><i class="f" style="--c:3.55s"></i><i style="--c:3.60s"></i><i style="--c:3.65s"></i><i style="--c:3.70s"></i><i style="--c:3.75s"></i><i style="--c:3.80s"></i><i style="--c:3.85s"></i><i style="--c:3.90s"></i><i style="--c:3.95s"></i><i style="--c:4.00s"></i><i style="--c:4.05s"></i><i style="--c:4.10s"></i><i style="--c:4.15s"></i><i style="--c:4.20s"></i></div></div>
  <div class="tools"><span class="chip in" style="--d:3.2s">🚩 題目標記</span><span class="chip in" style="--d:3.4s">▦ 答題卡跳題</span><span class="chip in" style="--d:3.6s">⏱ 倒數警示</span><span class="chip in" style="--d:3.8s">✋ 漏答防呆</span></div>
 </div>
<script>(function(){const e=document.getElementById('tm');function f(){const t=performance.now()/1000;let s=Math.max(0,3600-Math.floor(Math.max(0,t-1.8)*37));
e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');requestAnimationFrame(f);}requestAnimationFrame(f);})();</script>
<!-- ▲▲ 本景內容 ▲▲ -->
</div>
<div class="mark">DOF Lab<b>.</b> · doflab.cc</div>
<div class="vig" style="z-index:3"></div>
</body></html>
