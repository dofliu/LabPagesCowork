<!doctype html>
<!-- doflab.cc 專案動畫 · 場景模板（品牌版：暖墨底 + 燒赭/暖金/深林綠）
     規則：1920×1080 固定；動畫從頁面載入 t=0 起算；禁止外連資源（file:// 離線渲染）。
     本地圖片放同層 assets/，用相對路徑 <img src="assets/shot_01.png">。
     每景只改 <title>、.stage 的 --dur、以及 <div class="stage"> 內的內容。 -->
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Counting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#15110d}
body{font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#f6efe3;position:relative}
/* 品牌色 */
:root{--paper:#faf6ef;--rust:#d2602f;--rust-deep:#b4451f;--gold:#d9ad5b;--forest:#5f9e86;--ink:#15110d}
/* ── 背景：暖墨底 + 燒赭/暖金光暈 + 紙紋格線 + 暗角 ── */
.bg{position:absolute;inset:0;background:
 radial-gradient(1200px 800px at 22% 18%,rgba(210,96,47,.17),transparent 62%),
 radial-gradient(1100px 760px at 80% 84%,rgba(217,173,91,.14),transparent 60%),
 linear-gradient(160deg,#241c15 0%,#15110d 58%,#0d0a07 100%)}
.aur{position:absolute;width:1500px;height:1500px;border-radius:50%;filter:blur(90px);opacity:.45;mix-blend-mode:screen}
.aur.a{background:radial-gradient(circle,rgba(210,96,47,.30),transparent 62%);left:-460px;top:-560px;animation:drift1 22s ease-in-out infinite alternate}
.aur.b{background:radial-gradient(circle,rgba(95,158,134,.26),transparent 62%);right:-520px;bottom:-620px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(150px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-130px,-80px) scale(1.08)}}
.vig{position:absolute;inset:0;background:radial-gradient(1600px 1000px at 50% 46%,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
.grid{position:absolute;inset:0;opacity:.045;background-image:linear-gradient(rgba(246,239,227,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(246,239,227,.5) 1px,transparent 1px);background-size:64px 64px}
/* 左下品牌浮水印（每景都在，維持系列感） */
.mark{position:absolute;left:64px;bottom:48px;z-index:4;font-size:26px;font-weight:700;letter-spacing:.08em;color:rgba(246,239,227,.55)}
.mark b{color:var(--rust)}
/* ── 鏡頭慢推（--dur 設成本景秒數） ── */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 --dur:7s;animation:cam var(--dur) ease-in-out both}
@keyframes cam{from{transform:scale(1)}to{transform:scale(1.05)}}
/* ── 字體系統 ── */
.kicker{font-size:30px;font-weight:700;letter-spacing:.5em;text-indent:.5em;color:var(--gold);text-transform:uppercase}
.h1{font-size:112px;font-weight:900;line-height:1.14;text-align:center;letter-spacing:.01em;
 background:linear-gradient(100deg,#fff8ec 18%,#f0c98a 52%,#e58a5c 84%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 8px 40px rgba(210,96,47,.22))}
.sub{font-size:40px;font-weight:400;color:rgba(246,239,227,.8);text-align:center;line-height:1.6}
.accent{color:var(--gold);font-weight:700}
/* ── 元件 ── */
.chip{display:inline-flex;align-items:center;gap:16px;padding:20px 38px;border-radius:999px;font-size:36px;font-weight:700;white-space:nowrap;
 background:rgba(40,31,23,.85);border:1.5px solid rgba(217,173,91,.28);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card{background:linear-gradient(165deg,rgba(44,34,25,.94),rgba(24,19,14,.95));border:1.5px solid rgba(217,173,91,.22);
 border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.badge{display:inline-block;padding:12px 26px;border-radius:12px;font-size:28px;font-weight:700;white-space:nowrap;
 background:rgba(210,96,47,.15);border:1.5px solid rgba(210,96,47,.5);color:#f3a57e}
.badge.g{background:rgba(95,158,134,.15);border-color:rgba(95,158,134,.5);color:#9fd6c1}
/* ── 真實素材版位 ── */
.shot{width:1400px;max-height:760px;border-radius:22px;overflow:hidden;background:#100c09;
 border:1.5px solid rgba(217,173,91,.25);box-shadow:0 40px 100px rgba(0,0,0,.6)}
.shot img{display:block;width:100%;height:auto}
.frame{width:480px;height:480px;border-radius:26px;overflow:hidden;background:#100c09;border:1.5px solid rgba(217,173,91,.22);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.logo{height:130px;width:auto;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.hero-img{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);opacity:.36;filter:saturate(.8) contrast(.95)}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;--scrim:.78;
 background:radial-gradient(1400px 900px at 50% 46%,rgba(13,10,7,calc(var(--scrim)*.55)),transparent 70%),
 linear-gradient(180deg,rgba(21,17,13,calc(var(--scrim)*.9)),rgba(13,10,7,var(--scrim)))}
/* ── 進場動畫工具類（--d 控延遲；注意：結尾 transform 會蓋掉 translate 置中） ── */
.in{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(56px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .8s cubic-bezier(.2,1.4,.35,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(210,96,47,.25))}50%{filter:drop-shadow(0 0 42px rgba(210,96,47,.55))}}
.in.glow{animation:rise 1s cubic-bezier(.16,1,.3,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
.pop.glow{animation:pop .8s cubic-bezier(.2,1.4,.35,1) var(--d,0s) both,glow 2.6s ease-in-out infinite}
/* ▼▼ 本景專屬 CSS ▼▼ */
/* 夜間國道配色：深藍夜色 + 頭燈琥珀 + 偵測青 */
:root{--gold:#ffb547;--rust:#3fd0e0;--forest:#4ade80}
html,body{background:#070c16}
body{color:#e8f0fb}
.bg{background:radial-gradient(1200px 800px at 20% 16%,rgba(63,208,224,.14),transparent 62%),
 radial-gradient(1100px 760px at 82% 86%,rgba(255,181,71,.13),transparent 60%),
 linear-gradient(160deg,#101a2c 0%,#070c16 60%,#04070d 100%)}
.aur.a{background:radial-gradient(circle,rgba(63,208,224,.26),transparent 62%)}
.aur.b{background:radial-gradient(circle,rgba(255,181,71,.22),transparent 62%)}
.grid{background-image:linear-gradient(rgba(170,200,240,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(170,200,240,.5) 1px,transparent 1px)}
.mark{color:rgba(232,240,251,.5)}
.h1{background:linear-gradient(100deg,#f4f9ff 15%,#9be7f0 50%,#ffc46b 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 40px rgba(63,208,224,.25))}
.sub{color:rgba(232,240,251,.82)}
.chip{background:rgba(16,28,46,.88);border-color:rgba(63,208,224,.32)}
.card{background:linear-gradient(165deg,rgba(20,34,56,.95),rgba(9,16,28,.96));border-color:rgba(63,208,224,.24)}
.badge{background:rgba(255,181,71,.13);border-color:rgba(255,181,71,.5);color:#ffcf85}
.badge.g{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.5);color:#9ef0bb}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 18px rgba(63,208,224,.25))}50%{filter:drop-shadow(0 0 42px rgba(63,208,224,.5))}}

.t{font-size:62px;font-weight:900;color:#f4f9ff;margin-bottom:44px}
.wrap{display:flex;gap:40px;align-items:center}
.feed{width:792px;height:468px;position:relative;overflow:hidden;padding:0}
.zm{position:absolute;left:0;top:0;width:880px;height:520px;zoom:.9}
.feed .hdr{position:absolute;left:24px;top:18px;font-size:24px;font-weight:700;color:#9be7f0;letter-spacing:.06em;z-index:3}
.rec{position:absolute;right:24px;top:20px;font-size:22px;color:#ff7a70;font-weight:700;z-index:3;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.bb{position:absolute;border:3px solid #3fd0e0;border-radius:4px;opacity:0;animation:bbin .4s ease-out both}
.bb.tk{border-color:#ffb547}
.bb span{position:absolute;left:-3px;top:-28px;font-size:18px;font-weight:700;background:#3fd0e0;color:#04101a;padding:1px 8px;border-radius:3px;white-space:nowrap}
.bb.tk span{background:#ffb547}
@keyframes bbin{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}
.counter{position:absolute;left:24px;bottom:20px;z-index:3;display:flex;align-items:baseline;gap:16px;background:rgba(4,8,14,.75);padding:10px 22px;border-radius:14px;border:1.5px solid rgba(63,208,224,.4)}
.counter b{font-size:64px;color:#3fd0e0;font-weight:900;font-variant-numeric:tabular-nums}
.counter i{font-style:normal;font-size:26px;color:#cfe0f5;white-space:nowrap}
.arrow{font-size:28px;font-weight:800;color:#ffb547;display:flex;flex-direction:column;align-items:center;gap:8px;white-space:nowrap}
.arrow svg{width:120px}
.vd{width:540px;padding:34px 36px}
.vd h3{font-size:32px;color:#ffcf85;margin-bottom:24px;white-space:nowrap}
.bar{display:flex;align-items:center;gap:16px;margin:16px 0;font-size:26px;color:#cfe0f5}
.bar .nm{width:150px;white-space:nowrap}
.bar .tr{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fl{height:100%;border-radius:9px;background:linear-gradient(90deg,#3fd0e0,#4ade80);width:0;animation:fill 1.4s cubic-bezier(.2,.8,.2,1) both}
.bar.hl .nm{color:#ffb547;font-weight:800}
.bar.hl .fl{background:linear-gradient(90deg,#ffb547,#ff7a3d)}
@keyframes fill{to{width:var(--w)}}
.note{margin-top:40px;font-size:28px;color:rgba(232,240,251,.75)}


/* ▲▲ 本景專屬 CSS ▲▲ */
</style></head>
<body>
<div class="bg"></div><div class="aur a"></div><div class="aur b"></div><div class="grid"></div>
<!-- 粒子層：開場/結尾景保留，功能景可刪 -->
<div class="stage" style="z-index:2;--dur:6.5s">
<!-- ▼▼ 本景內容 ▼▼ -->
<div class="t in" style="--d:.1s">AI 數車，偵測器給標準答案</div>
 <div class="wrap">
  <div class="card feed in" style="--d:.3s"><div class="zm"><svg width="880" height="520" style="position:absolute;inset:0"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16243a"/><stop offset="1" stop-color="#0a121e"/></linearGradient></defs>
<rect width="880" height="520" fill="url(#sk)"/><polygon points="400,120 480,120 820,520 60,520" fill="#232d3b"/>
<line x1="440" y1="120" x2="440" y2="520" stroke="#ffd36b" stroke-width="4" stroke-dasharray="24 22"/>
<line x1="420" y1="120" x2="250" y2="520" stroke="#e8f0fb" stroke-opacity=".5" stroke-width="3" stroke-dasharray="20 26"/>
<line x1="460" y1="120" x2="630" y2="520" stroke="#e8f0fb" stroke-opacity=".5" stroke-width="3" stroke-dasharray="20 26"/><rect x="336" y="338" width="58" height="38" rx="8" fill="#8aa0bd"/><rect x="342" y="368" width="46" height="5" fill="#ff5a4e"/><rect x="476" y="358" width="62" height="40" rx="8" fill="#8aa0bd"/><rect x="482" y="390" width="50" height="5" fill="#ff5a4e"/><rect x="566" y="258" width="40" height="26" rx="8" fill="#8aa0bd"/><rect x="572" y="276" width="28" height="5" fill="#ff5a4e"/><rect x="416" y="248" width="38" height="24" rx="8" fill="#8aa0bd"/><rect x="422" y="264" width="26" height="5" fill="#ff5a4e"/><rect x="296" y="418" width="84" height="56" rx="8" fill="#c9a46a"/><rect x="302" y="466" width="72" height="5" fill="#ff5a4e"/><rect x="626" y="408" width="78" height="50" rx="8" fill="#8aa0bd"/><rect x="632" y="450" width="66" height="5" fill="#ff5a4e"/><rect x="486" y="198" width="28" height="16" rx="8" fill="#8aa0bd"/><rect x="492" y="206" width="16" height="5" fill="#ff5a4e"/><rect x="376" y="188" width="26" height="14" rx="8" fill="#8aa0bd"/><rect x="382" y="194" width="14" height="5" fill="#ff5a4e"/></svg><div class="bb " style="left:330px;top:330px;width:70px;height:52px;animation-delay:1.2s"><span>car</span></div><div class="bb " style="left:470px;top:350px;width:74px;height:54px;animation-delay:1.5s"><span>car</span></div><div class="bb " style="left:560px;top:250px;width:52px;height:40px;animation-delay:1.8s"><span>car</span></div><div class="bb " style="left:410px;top:240px;width:50px;height:38px;animation-delay:2.1s"><span>car</span></div><div class="bb tk" style="left:290px;top:410px;width:96px;height:70px;animation-delay:2.4s"><span>truck</span></div><div class="bb " style="left:620px;top:400px;width:90px;height:64px;animation-delay:2.7s"><span>car</span></div><div class="bb " style="left:480px;top:190px;width:40px;height:30px;animation-delay:3.0s"><span>car</span></div><div class="bb " style="left:370px;top:180px;width:38px;height:28px;animation-delay:3.2s"><span>car</span></div></div><div class="hdr">CCTV · 主線即時快照</div><div class="rec">● REC</div>
   <div class="counter"><b id="n">0</b><i>影像車數</i></div></div>
  <div class="arrow pop" style="--d:3.4s"><svg viewBox="0 0 120 40"><path d="M4 20H100M86 6l16 14-16 14" stroke="#ffb547" stroke-width="6" fill="none" stroke-linecap="round"/></svg>比對「密度」</div>
  <div class="card vd in" style="--d:.6s"><h3>📡 同路段 VD 地面真值</h3>
   <div class="bar "><span class="nm">流量</span><div class="tr"><div class="fl" style="--w:62%;animation-delay:1.0s"></div></div></div><div class="bar "><span class="nm">速率</span><div class="tr"><div class="fl" style="--w:48%;animation-delay:1.3s"></div></div></div><div class="bar "><span class="nm">佔有率</span><div class="tr"><div class="fl" style="--w:71%;animation-delay:1.6s"></div></div></div><div class="bar hl"><span class="nm">密度</span><div class="tr"><div class="fl" style="--w:78%;animation-delay:1.9s"></div></div></div>
  </div></div>
 <div class="note in" style="--d:3.9s">車數代表某一瞬間路段上的車量 → 與 VD 密度、佔有率比對</div>
<script>const ts=[1.2,1.5,1.8,2.1,2.4,2.7,3.0,3.2];const el=document.getElementById('n');(function f(){const t=performance.now()/1000;el.textContent=ts.filter(x=>t>=x).length;requestAnimationFrame(f)})();</script>
<!-- ▲▲ 本景內容 ▲▲ -->
</div>
<div class="mark">DOF Lab<b>.</b> · doflab.cc</div>
<div class="vig" style="z-index:3"></div>
</body></html>
